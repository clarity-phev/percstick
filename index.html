<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <script type="module">
    // Android Chrome has no native USB serial support, so give it a
    // WebUSB-based Web Serial polyfill before ESP Web Tools loads.
    if (/Android/i.test(navigator.userAgent) && 'usb' in navigator) {
      const { serial } = await import('https://unpkg.com/web-serial-polyfill@1.0.15/dist/serial.js');
      Object.defineProperty(navigator, 'serial', { value: serial, configurable: true });
    }
    await import('https://unpkg.com/esp-web-tools@10.4.0/dist/web/install-button.js?module');
  </script>
  
  <style>
    .device-row {
      display: flex;
      flex-wrap: wrap;
      gap: 48px; /* horizontal separation between the two pulldowns */
      margin-top: 16px;
    }
    .device {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .buttonHolder {
      margin-top: 6px;
    }
    .erase-warning {
      margin-top: 24px;
      padding: 10px 14px;
      border: 1px solid #e0b04a;
      background: #fff8e6;
      border-radius: 6px;
      font-size: 0.95em;
      max-width: 480px;
    }
    .subtitle {
     margin-top: -12px;
     color: #555;
     font-size: 1.3em;
     font-weight: bold;
   }
  </style>
</head>
<body>

  <h1>Percolation Firmware Update</h1>
  <p class="subtitle">Chrome/Edge/Firefox</p>

  <ol>
    <li>Choose a firmware version</li>
    <li>Connect Device via USB</li>
    <li>Click Proceed</li>
  </ol>

  <div class="device-row">
    <div class="device">
      <label for="stickSelect">PercStick version:</label>
      <select id="stickSelect" autocomplete="off">
        <option value="firmware/v4.0/manifest.json">v4.1 (latest)</option>
        <option value="firmware/v3.0/manifest.json">v3.1</option>
        <option value="firmware/v2.0/manifest.json">v2.3</option>
        <option value="firmware/v1.0/manifest.json">v1.3</option>
      </select>
      <div class="buttonHolder" id="stickButtonHolder"></div>
    </div>

    <div class="device">
      <label for="permSelect">Permeameter version:</label>
      <select id="permSelect" autocomplete="off">
        <option value="permfirmware/v6.0/manifest.json">v6.0 (latest)</option>
      </select>
      <div class="buttonHolder" id="permButtonHolder"></div>
    </div>
  </div>

  <p class="erase-warning">
    ⚠️ <strong>"Erase device" wipes calibration data.</strong>
    Leave it <strong>unchecked</strong> for a routine firmware update on a working unit.
    Only check it for a brand-new, never-calibrated unit.
  </p>

  <script>
    function renderButton(select, holder) {
      // Fresh element each time — the custom element reads `manifest`
      // when it's connected to the DOM.
      holder.innerHTML = '';
      const btn = document.createElement('esp-web-install-button');
      btn.setAttribute('manifest', select.value);

      const activateBtn = document.createElement('button');
      activateBtn.setAttribute('slot', 'activate');
      activateBtn.textContent = 'Proceed';
      btn.appendChild(activateBtn);

      holder.appendChild(btn);
    }

    function wire(selectId, holderId) {
      const select = document.getElementById(selectId);
      const holder = document.getElementById(holderId);
      select.addEventListener('change', () => renderButton(select, holder));
      renderButton(select, holder);
    }

    wire('stickSelect', 'stickButtonHolder');
    wire('permSelect', 'permButtonHolder');
  </script>
</body>
</html>
